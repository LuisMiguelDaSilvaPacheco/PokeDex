<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex</title>
    <script src="script.js" defer></script> 
    <!-- A utilização do "defer" faz com que o código HTML seja carregado antes do script -->
     <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img id="logo" src="images/RotomDex.png">
    </header>

    <form id="formulario">
        <input id="Buscar" type="text" value="" placeholder="Digite o nome ou id do pokemon:">
        <button>Enviar</button>
        <button id="Aleatorio">Aleatório</button>
    </form>

    <section id="Resultado"></section>
</body>
</html>
